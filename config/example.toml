[app]
mode = "web"
bind_host = "127.0.0.1"
bind_port = 8080
default_planning = false
approval_timeout_seconds = 300.0
runtime_dir = "runtime"

[capture]
device = "/dev/video0"
width = 0
height = 0
fps = 0
warmup_frames = 60
min_brightness = 5.0
ready_timeout = 5.0
save_width = 1280
jpeg_quality = 80

[hid]
port = "/dev/serial0"
baudrate = 115200
timeout = 0.5

[openai]
api_key_file = "/home/nama/openai-api-key.txt"
api_key_env = "OPENAI_API_KEY"
model = "gpt-5.5"
prompts_file = "pi/prompts.yaml"
api_timeout = 60.0
max_action_turns = 5
max_completion_rounds = 3
max_verify_turns = 5
planning_model = "gpt-5.5"

[logs]
database = "runtime/app.db"
screenshot_dir = "runtime/screenshots"
max_memory_logs = 100
max_screenshots = 5000
max_storage_mb = 1024

[token_budget]
baseline_tokens_per_operation = 1000
max_tokens_per_operation = 20000
max_tokens_per_step = 20000
max_tokens_per_plan = 100000
max_tokens_per_day = 200000

[email]
enabled = false
delivery = "smtp"
smtp_account_file = "/home/nama/mail-send-vert.txt"
to_addrs = []
min_interval_sec = 300.0
rate_limit_per_hour = 10
attachment_limit_mb = 10

[discord]
enabled = false
token_file = "/home/nama/discord-api-key.txt"
bot_name = "AgentDev"
bot_user_id = ""
guild_id = ""
channel_id = ""
allowed_guild_ids = []
allowed_channel_ids = []
allowed_user_ids = []
poll_interval_sec = 5.0
poll_limit = 20
skip_existing_on_startup = true
max_command_age_sec = 60.0
api_timeout = 15.0
rate_limit_per_hour = 20
attachment_limit_mb = 8
